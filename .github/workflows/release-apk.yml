# Compila la APK firmada y la publica en Releases para descargarla e instalarla desde el celular.
# La APK apunta siempre al backend de producción (Render), por eso solo sale de commits de main.
#
# Cómo sacar una versión (cualquiera de las dos):
#   - Actions → "Release APK" → Run workflow (rama main) → escribir la versión, ej. 1.2.0
#   - Terminal: git tag v1.2.0 && git push origin v1.2.0
#
# Enlace fijo a la última versión (para compartir por WhatsApp):
#   https://github.com/ingmao021/cosechapp/releases/latest/download/CosechApp.apk
#
# Secretos del repo: ANDROID_KEYSTORE_BASE64 (el .jks en base64), ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS y ANDROID_KEY_PASSWORD. El keystore no se puede cambiar: con otra firma el
# celular no deja actualizar encima y toca desinstalar (se pierden las pesadas sin sincronizar).
name: Release APK

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión (ej. 1.2.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-apk

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # v1.2.3 → versionName 1.2.3 y versionCode 10203 (siempre crece, así Android deja actualizar)
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${INPUT_VERSION#v}"
            if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
              echo "::error::La versión v$VERSION ya existe. Usa un número nuevo."
              exit 1
            fi
          fi
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)$ ]]; then
            echo "::error::Versión inválida '$VERSION'. Usa el formato 1.2.0 (menor y parche hasta 99)."
            exit 1
          fi
          CODE=$((BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3]))
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Only from main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::La versión debe salir de un commit de main (lo que corre en Render)."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Build de producción: environment.prod.ts → https://cosechapp-backend.onrender.com
      - run: npx ng build --configuration production,ci

      - run: npx cap sync android

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build signed APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/cosechapp-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto ANDROID_KEYSTORE_BASE64."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          ./gradlew assembleRelease \
            -PappVersionCode=${{ steps.version.outputs.code }} \
            -PappVersionName=${{ steps.version.outputs.name }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk CosechApp.apk
          gh release create "v$VERSION" CosechApp.apk \
            --target "$GITHUB_SHA" \
            --title "CosechApp $VERSION" \
            --generate-notes \
            --notes "**Instalar:** desde el celular descarga **CosechApp.apk** (abajo, en Assets), ábrela y, si Android lo pide, permite instalar apps de esta fuente. Si ya tienes CosechApp, se actualiza sin perder tus datos."
